<div class="charts-row">

  <!-- GRÁFICO POR TIPO -->
  <div class="chart-card">
    <div class="chart-container mat-elevation-z8">
      <ag-charts
        #chartTipo
        [options]="chartOptionsTipo">
      </ag-charts>
    </div>

    <div class="chart-toolbar">
      <button
        mat-raised-button
        color="primary"
        (click)="exportarExcelTipo()">
        Exportar a Excel
      </button>

      <button
        mat-raised-button
        color="accent"
        (click)="exportarPowerBITipo()">
        Exportar a PowerBI
      </button>
    </div>
  </div>


  <!-- GRÁFICO DE PRODUCTOS -->
  <div class="chart-card">
    <div class="chart-container mat-elevation-z8">
      <ag-charts
        #chartProductos
        [options]="chartOptionsProductos">
      </ag-charts>
    </div>

    <div class="chart-toolbar">
      <button
        mat-raised-button
        color="primary"
        (click)="exportarExcelProductos()">
        Exportar a Excel
      </button>

      <button
        mat-raised-button
        color="accent"
        (click)="exportarPowerBIProductos()">
        Exportar a PowerBI
      </button>
    </div>
  </div>


  <!-- GRÁFICO DE USUARIOS -->
  <div class="chart-card">
    <div class="chart-container mat-elevation-z8">
      <ag-charts
        #chartUsuario
        [options]="chartOptionsUsuario">
      </ag-charts>
    </div>

    <div class="chart-toolbar">
      <button
        mat-raised-button
        color="primary"
        (click)="exportarExcelUsuario()">
        Exportar a Excel
      </button>

      <button
        mat-raised-button
        color="accent"
        (click)="exportarPowerBIUsuario()">
        Exportar a PowerBI
      </button>
    </div>
  </div>

</div>
