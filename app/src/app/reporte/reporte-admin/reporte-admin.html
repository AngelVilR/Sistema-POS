<div class="chart-toolbar">
  <button mat-raised-button color="primary" (click)="exportarExcelTipo()">Exportar a Excel</button>
  <button mat-raised-button color="accent" (click)="exportarPowerBITipo()">Exportar a PowerBI</button>
</div>
<div class="chart-container mat-elevation-z8">
  <ag-charts #chartTipo style="height: 100%; width: 100%;" [options]="chartOptionsTipo"></ag-charts>
</div>
